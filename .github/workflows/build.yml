name: Build Minion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helper:
    runs-on: macos-15
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Compile AcademyLSDefault (MD-T3 helper, 10.13 floor, x86_64)
        run: |
          clang -arch x86_64 -mmacosx-version-min=10.13 \
            -framework CoreServices -framework Foundation \
            -o AcademyLSDefault tools/AcademyLSDefault.m
          file AcademyLSDefault
          otool -l AcademyLSDefault | grep -A1 LC_VERSION_MIN_MACOSX || true

      - name: Upload the helper
        uses: actions/upload-artifact@v4
        with:
          name: ls-helper
          path: AcademyLSDefault

  build:
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Unit tests (history, window-state, terminal, markdown routing + SDS-10 scans)
        run: node test/run-tests.cjs

      - name: Download the MD-T3 helper
        uses: actions/download-artifact@v4
        with:
          name: ls-helper

      - name: Fetch the pinned Electron distribution
        run: |
          curl -sL -o electron.zip https://github.com/electron/electron/releases/download/v22.3.27/electron-v22.3.27-darwin-x64.zip
          echo "01f053d08cb2855acb14f0465f4e36324a41bd13b3b2ead142970a56df3e9db1  electron.zip" | sha256sum -c -

      - name: Assemble + self-verify the package
        run: |
          python3 tools/assemble.py \
            --dist electron.zip --app app --assets assets \
            --ls-helper AcademyLSDefault \
            --out Muse-Academy-1013-x64.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create muse-academy-0.4.0-minion1 \
            Muse-Academy-1013-x64.zip \
            --title "Minion 0.4.0-minion1" \
            --notes "The rename build (Distro files/19 section 11), on the owner's directives of 2026-11-10 21:49-21:50 EST: 'rename academy muse to minion. set icon to your most nefarious avatar' + 'monochrome standard obviously'. (1) The app is Minion: bundle Minion.app, executable Minion, bundle name and display name Minion on every shipped surface — windows, About, welcome, terminal. It ships under com.detroitautomationacademy.minion, completing the identity sequence the owner set in motion at 21:14 EST when the ai.muse.desktop carve-out was revoked (academy5 carried the Academy identity as com.detroitautomationacademy.muse; this build takes the renamed app's own identifier). macOS treats the new identity as a new app: expect a fresh sign-in on first launch; message history and preferences carry (the data folder is path-pinned and did not move). (2) The icon is Minion's own mark — the scheming side-eye dog avatar — rendered to the Academy monochrome standard: white rounded tile, the artwork in the ink ramp, black field trimmed, zero saturated pixels at every shipped size; the same master serves the bundle icon, the welcome, and the Distro catalog. (3) Everything from academy5 stands unchanged: the genuine Terminal view (View menu, Command-T) over the live hosted session, the terminal skin deleted outright, markdown routing + consented system default + Distro deep link, window repair, up-arrow history, SDS-8 welcome, SDS-10 conformance. Built from the open-source muse-desktop v0.3.0 (MIT) on the pinned Electron 22.3.27 distribution. Unsigned test build. Unofficial build: not a Meta product and not endorsed by Meta."
