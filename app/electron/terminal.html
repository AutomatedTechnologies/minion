<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Terminal — Minion</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0a0a0a;
    color: #e8e8e8;
    font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  body { display: flex; flex-direction: column; }
  #bar {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 12px;
    border-bottom: 1px solid #3a3a3a;
    background: #111111;
  }
  #bar .title { color: #ffffff; letter-spacing: 1px; }
  #state { color: #9a9a9a; }
  #scrollback {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 12px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #scrollback .line { margin: 0 0 2px 0; }
  #scrollback .you { color: #ffffff; }
  #scrollback .sys { color: #9a9a9a; }
  #scrollback .err { color: #d6d6d6; font-style: italic; }
  #scrollback .asst { color: #e8e8e8; margin-bottom: 10px; }
  .cursor-block { color: #ffffff; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #promptrow {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border-top: 1px solid #3a3a3a;
    background: #111111;
  }
  #prompt { color: #ffffff; white-space: nowrap; }
  .field { position: relative; flex: 1 1 auto; display: flex; }
  #cmd {
    flex: 1 1 auto;
    background: #1a1a1a;
    color: #f5f5f5;
    border: 2px solid #6a6a6a;
    padding: 7px 9px;
    font: inherit;
    caret-color: #ffffff;
    outline: none;
  }
  #cmd:focus { border-color: #ffffff; background: #222222; }
  #block {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: #ffffff;
    pointer-events: none;
    animation: blink 1s steps(1) infinite;
  }
</style>
</head>
<body>
  <div id="bar">
    <span class="title">MUSE — TERMINAL</span>
    <span id="state">session: connecting…</span>
  </div>
  <div id="scrollback"></div>
  <form id="promptrow" autocomplete="off">
    <span id="prompt">minion ❯</span>
    <span class="field">
      <input id="cmd" type="text" spellcheck="false" aria-label="Message to Minion">
      <span id="block">█</span>
    </span>
  </form>
<script>
(function () {
  'use strict';
  var scrollback = document.getElementById('scrollback');
  var form = document.getElementById('promptrow');
  var input = document.getElementById('cmd');
  var block = document.getElementById('block');
  var stateEl = document.getElementById('state');
  var bridge = window.academyTerminal || null;

  var historyEntries = [];
  var navIndex = -1; // -1 == the draft line
  var draft = '';
  var streaming = null; // the in-progress assistant block element

  function scrollToBottom() {
    scrollback.scrollTop = scrollback.scrollHeight;
  }
  function print(text, cls) {
    var div = document.createElement('div');
    div.className = 'line ' + (cls || '');
    div.textContent = text;
    scrollback.appendChild(div);
    scrollToBottom();
    return div;
  }
  function syncBlock() {
    block.style.display = input.value.length === 0 ? 'block' : 'none';
  }
  function setState(composer) {
    stateEl.textContent = composer
      ? 'session: live — hosted Muse window'
      : 'session: no message box — sign in via the main Muse window';
  }

  print('Minion — terminal', 'sys');
  if (bridge && bridge.info) {
    bridge.info().then(function (info) {
      if (info && info.build) {
        print('build ' + info.build + ' · a terminal front-end over the live hosted Muse session in the main window', 'sys');
      }
      print('Type a message and press Enter. /help lists the local commands.', 'sys');
    }).catch(function () { /* banner stands without it */ });
  } else {
    print('Terminal bridge unavailable — this window cannot reach the hosted session.', 'err');
  }
  if (bridge && bridge.history) {
    bridge.history().then(function (items) {
      if (Array.isArray(items)) historyEntries = items.slice();
    }).catch(function () { /* recall is best-effort */ });
  }
  if (bridge && bridge.onEvent) {
    bridge.onEvent(function (payload) {
      if (!payload || typeof payload !== 'object') return;
      if (payload.type === 'state') {
        setState(!!payload.composer);
      } else if (payload.type === 'delta') {
        if (!streaming) {
          streaming = print('', 'asst');
        }
        streaming.textContent = payload.text || '';
        var cur = document.createElement('span');
        cur.className = 'cursor-block';
        cur.textContent = ' █';
        streaming.appendChild(cur);
        scrollToBottom();
      } else if (payload.type === 'done') {
        if (streaming) {
          streaming.textContent = payload.text || streaming.textContent;
          streaming = null;
        } else if (payload.text) {
          print(payload.text, 'asst');
        }
        if (payload.note) print('[' + payload.note + ']', 'sys');
        scrollToBottom();
      }
    });
  }

  function showHelp() {
    print('/help   this list', 'sys');
    print('/clear  clear the scrollback', 'sys');
    print('/view   back to the hosted Muse window', 'sys');
    print('Anything else is a message to Minion, sent through the hosted session.', 'sys');
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var text = input.value;
    var trimmed = text.trim();
    input.value = '';
    syncBlock();
    navIndex = -1;
    draft = '';
    if (!trimmed) return;
    if (trimmed === '/clear') {
      scrollback.innerHTML = '';
      streaming = null;
      return;
    }
    if (trimmed === '/help') {
      showHelp();
      return;
    }
    if (trimmed === '/view') {
      if (bridge) bridge.showHosted();
      return;
    }
    if (trimmed.charAt(0) === '/') {
      print('Unknown local command: ' + trimmed + ' — /help lists them. Nothing was sent.', 'err');
      return;
    }
    if (streaming) {
      print('Still answering — wait for the current reply to finish.', 'err');
      input.value = text;
      syncBlock();
      return;
    }
    print('minion ❯ ' + trimmed, 'you');
    historyEntries.push(trimmed);
    if (!bridge) {
      print('Terminal bridge unavailable — nothing was sent.', 'err');
      return;
    }
    bridge.send(trimmed).then(function (result) {
      if (result && result.ok === false) {
        if (streaming) {
          streaming.remove();
          streaming = null;
        }
        print('!! ' + (result.error || 'The send failed.'), 'err');
      }
    }).catch(function () {
      print('!! The send failed — the main process did not answer.', 'err');
    });
  });

  input.addEventListener('keydown', function (event) {
    if (event.key === 'ArrowUp') {
      if (historyEntries.length === 0) return;
      if (navIndex === -1) {
        draft = input.value;
        navIndex = historyEntries.length - 1;
      } else if (navIndex > 0) {
        navIndex -= 1;
      } else {
        return;
      }
      input.value = historyEntries[navIndex];
      syncBlock();
      event.preventDefault();
    } else if (event.key === 'ArrowDown') {
      if (navIndex === -1) return;
      if (navIndex < historyEntries.length - 1) {
        navIndex += 1;
        input.value = historyEntries[navIndex];
      } else {
        navIndex = -1;
        input.value = draft;
      }
      syncBlock();
      event.preventDefault();
    }
  });
  input.addEventListener('input', syncBlock);
  document.addEventListener('click', function () { input.focus(); });
  syncBlock();
  input.focus();
})();
</script>
</body>
</html>
