name: Build Muse (Academy Build)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Unit tests (history, window-state, skin, markdown routing + SDS-10 scans)
        run: node test/run-tests.cjs

      - name: Fetch the pinned Electron distribution
        run: |
          curl -sL -o electron.zip https://github.com/electron/electron/releases/download/v22.3.27/electron-v22.3.27-darwin-x64.zip
          echo "01f053d08cb2855acb14f0465f4e36324a41bd13b3b2ead142970a56df3e9db1  electron.zip" | sha256sum -c -

      - name: Assemble + self-verify the package
        run: |
          python3 tools/assemble.py \
            --dist electron.zip --app app --assets assets \
            --out Muse-Academy-1013-x64.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create muse-academy-0.4.0-academy3 \
            Muse-Academy-1013-x64.zip \
            --title "Muse (Academy Build) 0.4.0-academy3" \
            --notes "Markdown files open in MacDown by default (owner directive 2026-11-10; design in Distro files/24, tranche MD-T1). When a download completes in the app and it is markdown (.md/.markdown, binary payloads vetoed by MIME), the shell opens it in MacDown, the Academy's markdown editor — the file itself stays in Downloads, nothing is moved or deleted. The routing lives entirely in the main process: no preload or page-side change (preload.cjs and terminal-skin.css are byte-identical to academy2), and the router opens only destinations the shell itself downloaded this session. A View-menu preference (Markdown Files Open In: MacDown / Ask Each Time / System Default) controls it; files over 10 MiB ask first; if MacDown is not installed, a dialog offers Distro, the system default, or keeping the file in Downloads. Everything else stands from academy2: the whitelist terminal skin, window-management repair, up-arrow sent-message history (per conversation, stored on this Mac only), SDS-8 welcome with the library startup sound, SDS-10 conformance + Academy audit entries in the bundle. Built from the open-source muse-desktop v0.3.0 (MIT) on the pinned Electron 22.3.27 distribution. Unsigned test build. Unofficial build: not a Meta product and not endorsed by Meta."
