name: Build Muse (Academy Build)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Unit tests (history, window-state, skin + SDS-10 scans)
        run: node test/run-tests.cjs

      - name: Fetch the pinned Electron distribution
        run: |
          curl -sL -o electron.zip https://github.com/electron/electron/releases/download/v22.3.27/electron-v22.3.27-darwin-x64.zip
          echo "01f053d08cb2855acb14f0465f4e36324a41bd13b3b2ead142970a56df3e9db1  electron.zip" | sha256sum -c -

      - name: Assemble + self-verify the package
        run: |
          python3 tools/assemble.py \
            --dist electron.zip --app app --assets assets \
            --out Muse-Academy-1013-x64.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create muse-academy-0.4.0-academy2 \
            Muse-Academy-1013-x64.zip \
            --title "Muse (Academy Build) 0.4.0-academy2" \
            --notes "Terminal Skin rebuilt under a whitelist discipline. The academy1 skin failed on the real hosted UI (owner screenshot 2026-11-10): its universal/structural selectors blacked out sidebar rows, covered panels with black blocks, boxed every button, and re-boxed the composer shell. The rebuilt sheet styles only three preload-tagged elements — the message stream (typography only), the composer (matched tint, caret, prompt glyph), and the composer shell (a painted left rule) — sets no layout property anywhere, and carries no root/body rules; toggling it off restores the stock UI in full without restart, and a persisted academy1 ON does not survive the upgrade (skin-preference epoch). Everything else from academy1 stands: window-management repair (windows never open partially off-screen; validated bounds restore; clamped popups; Dock activation restores), up-arrow sent-message history (per conversation, stored on this Mac only), SDS-8 welcome with the library startup sound, SDS-10 conformance + Academy audit entries in the bundle. Built from the open-source muse-desktop v0.3.0 (MIT) on the pinned Electron 22.3.27 distribution. Unsigned test build. Unofficial build: not a Meta product and not endorsed by Meta."
