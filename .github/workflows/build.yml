name: Build Minion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helper:
    runs-on: macos-15
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Compile AcademyLSDefault (MD-T3 helper, 10.13 floor, x86_64)
        run: |
          clang -arch x86_64 -mmacosx-version-min=10.13 \
            -framework CoreServices -framework Foundation \
            -o AcademyLSDefault tools/AcademyLSDefault.m
          file AcademyLSDefault
          otool -l AcademyLSDefault | grep -A1 LC_VERSION_MIN_MACOSX || true

      - name: Upload the helper
        uses: actions/upload-artifact@v4
        with:
          name: ls-helper
          path: AcademyLSDefault

  build:
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Unit tests (history, window-state, terminal, markdown routing + SDS-10 scans)
        run: node test/run-tests.cjs

      - name: Download the MD-T3 helper
        uses: actions/download-artifact@v4
        with:
          name: ls-helper

      - name: Fetch the pinned Electron distribution
        run: |
          curl -sL -o electron.zip https://github.com/electron/electron/releases/download/v22.3.27/electron-v22.3.27-darwin-x64.zip
          echo "01f053d08cb2855acb14f0465f4e36324a41bd13b3b2ead142970a56df3e9db1  electron.zip" | sha256sum -c -

      - name: Assemble + self-verify the package
        run: |
          python3 tools/assemble.py \
            --dist electron.zip --app app --assets assets \
            --ls-helper AcademyLSDefault \
            --out Minion-1013-x64.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create minion-0.4.2 \
            Minion-1013-x64.zip \
            --title "Minion 0.4.2" \
            --notes "Minion 0.4.2 — the sign-in repair. 0.4.1's rename pass had renamed two plumbing identities along with the display name: the session partition (the session store's identity) and the package identity the app's session machinery derives from. Sign-in broke: an existing sign-in was orphaned, and a fresh sign-in spun forever after the two-factor step. 0.4.2 restores both plumbing identities to the values the working builds used, so a sign-in made in an earlier build carries into this one and a fresh sign-in completes. Nothing about the app's name or surfaces changes: bundle Minion.app under com.detroitautomationacademy.minion, monochrome avatar icon, title bar pinned to Minion, dark by default (View → Appearance records your explicit choice and later launches honor it), the genuine Terminal view (View menu, Command-T) over the live hosted session, markdown routing to MacDown with the consented system default, window repair, up-arrow sent-message history stored only on this Mac, data stored separately at ~/Library/Application Support/com.detroitautomationacademy.minion, SDS-8 welcome, SDS-10 conformance. Note: sign-ins made inside 0.4.1's own separate session store are not read by this build; sign in once more if 0.4.1 was your only build. Built by the Detroit Automation Academy (application layer MIT) on the pinned Electron 22.3.27 distribution — the last Electron that runs on macOS 10.13. Unsigned test build. Unofficial build: not a Meta product and not endorsed by Meta."
