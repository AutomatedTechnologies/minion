name: Build Minion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helper:
    runs-on: macos-15
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Compile AcademyLSDefault (MD-T3 helper, 10.13 floor, x86_64)
        run: |
          clang -arch x86_64 -mmacosx-version-min=10.13 \
            -framework CoreServices -framework Foundation \
            -o AcademyLSDefault tools/AcademyLSDefault.m
          file AcademyLSDefault
          otool -l AcademyLSDefault | grep -A1 LC_VERSION_MIN_MACOSX || true

      - name: Upload the helper
        uses: actions/upload-artifact@v4
        with:
          name: ls-helper
          path: AcademyLSDefault

  build:
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Unit tests (history, window-state, terminal, markdown routing + SDS-10 scans)
        run: node test/run-tests.cjs

      - name: Download the MD-T3 helper
        uses: actions/download-artifact@v4
        with:
          name: ls-helper

      - name: Fetch the pinned Electron distribution
        run: |
          curl -sL -o electron.zip https://github.com/electron/electron/releases/download/v22.3.27/electron-v22.3.27-darwin-x64.zip
          echo "01f053d08cb2855acb14f0465f4e36324a41bd13b3b2ead142970a56df3e9db1  electron.zip" | sha256sum -c -

      - name: Assemble + self-verify the package
        run: |
          python3 tools/assemble.py \
            --dist electron.zip --app app --assets assets \
            --ls-helper AcademyLSDefault \
            --out Muse-Academy-1013-x64.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create muse-academy-0.4.0-minion3 \
            Muse-Academy-1013-x64.zip \
            --title "Minion 0.4.0-minion3" \
            --notes "The presentation build, on the owner's directive of 2026-11-10 22:36 EST (his Air screenshot the same minute: app menu 'Minion', title bar still 'Muse', hosted UI light). (1) TITLE BAR: the window title reads Minion. The BrowserWindow was already created with that title, but a loaded page replaces the window title with its own <title> on every navigation — muse.ai's is 'Muse' — so the hosted window now refuses the page's title updates and the chrome keeps the app's name. Only the hosted window is pinned: popup windows are transient sign-in surfaces whose titles are their pages' content, and the welcome/terminal windows already carry Minion titles. (2) DARK BY DEFAULT: the shell's appearance is applied through Electron nativeTheme.themeSource — the lever that sets prefers-color-scheme for every webContents, and on macOS 10.13 (which has no system dark mode) the only lever that reaches the hosted UI's dark scheme at all. A fresh profile presents DARK. The default is a seed, not a lock: View → Appearance (Dark / Light / System) records the owner's explicit choice in the app state and later launches apply that choice; the dark default fills only the unset branch. Standing from minion2/minion1: data stored separately at ~/Library/Application Support/com.detroitautomationacademy.minion (fresh start, predecessor's data untouched); declared predecessor Muse (Academy Build), bundle ai.muse.desktop; bundle Minion.app under com.detroitautomationacademy.minion with the monochrome avatar icon. Everything from academy5 stands: the genuine Terminal view (View menu, Command-T) over the live hosted session, the terminal skin deleted outright, markdown routing + consented system default + Distro deep link, window repair, up-arrow history, SDS-8 welcome, SDS-10 conformance. Built from the open-source muse-desktop v0.3.0 (MIT) on the pinned Electron 22.3.27 distribution. Unsigned test build. Unofficial build: not a Meta product and not endorsed by Meta."
