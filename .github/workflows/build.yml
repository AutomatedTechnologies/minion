name: Build Muse (Academy Build)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helper:
    runs-on: macos-15
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Compile AcademyLSDefault (MD-T3 helper, 10.13 floor, x86_64)
        run: |
          clang -arch x86_64 -mmacosx-version-min=10.13 \
            -framework CoreServices -framework Foundation \
            -o AcademyLSDefault tools/AcademyLSDefault.m
          file AcademyLSDefault
          otool -l AcademyLSDefault | grep -A1 LC_VERSION_MIN_MACOSX || true

      - name: Upload the helper
        uses: actions/upload-artifact@v4
        with:
          name: ls-helper
          path: AcademyLSDefault

  build:
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Unit tests (history, window-state, terminal, markdown routing + SDS-10 scans)
        run: node test/run-tests.cjs

      - name: Download the MD-T3 helper
        uses: actions/download-artifact@v4
        with:
          name: ls-helper

      - name: Fetch the pinned Electron distribution
        run: |
          curl -sL -o electron.zip https://github.com/electron/electron/releases/download/v22.3.27/electron-v22.3.27-darwin-x64.zip
          echo "01f053d08cb2855acb14f0465f4e36324a41bd13b3b2ead142970a56df3e9db1  electron.zip" | sha256sum -c -

      - name: Assemble + self-verify the package
        run: |
          python3 tools/assemble.py \
            --dist electron.zip --app app --assets assets \
            --ls-helper AcademyLSDefault \
            --out Muse-Academy-1013-x64.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create muse-academy-0.4.0-academy5 \
            Muse-Academy-1013-x64.zip \
            --title "Muse (Academy Build) 0.4.0-academy5" \
            --notes "The genuine Terminal build (Distro files/19 section 10), on the owner's ruling of 2026-11-10 21:12 EST. (1) The terminal skin is DELETED — stylesheet file, View-menu toggle, skin IPC and the SKIN_EPOCH machinery are gone, not defaulted-off; the artifact self-verifies that no terminal-skin.css ships; the stock hosted UI returns untouched. Removal was ordered at the academy2 rig verdict (18:30 EST) and is settled definitively here: academy3/academy4 kept the sheet byte-identical under the approved MD design (files/19 section 7.4), so no earlier catalog note could claim it. (2) A genuine Terminal view (View menu, Command-T): the shell's own window — monochrome, monospace, scrollback, prompt line minion ❯ with a real bordered text field. It is a front-end over the live hosted session: the send is driven into the hosted window's composer through the preload bridge and the reply is observed from the hosted message stream as it renders (snapshot deltas at poll pace, not an API token stream). Local commands: /clear, /help, /view. The window hides rather than closes, so the scrollback survives switching views. (3) Academy bundle identity: this build ships under com.detroitautomationacademy.muse — the owner revoked the ai.muse.desktop carve-out on 2026-11-10 21:14 EST. macOS treats the new identity as a new app: expect a fresh sign-in on first launch; message history and preferences carry (the data folder is path-pinned and did not move). Everything else stands from academy4: markdown routing + consented system default + Distro deep link, window repair, up-arrow history, SDS-8 welcome, SDS-10 identity. Built from the open-source muse-desktop v0.3.0 (MIT) on the pinned Electron 22.3.27 distribution. Unsigned test build. Unofficial build: not a Meta product and not endorsed by Meta."
