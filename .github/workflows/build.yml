name: Build Minion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helper:
    runs-on: macos-15
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Compile AcademyLSDefault (MD-T3 helper, 10.13 floor, x86_64)
        run: |
          clang -arch x86_64 -mmacosx-version-min=10.13 \
            -framework CoreServices -framework Foundation \
            -o AcademyLSDefault tools/AcademyLSDefault.m
          file AcademyLSDefault
          otool -l AcademyLSDefault | grep -A1 LC_VERSION_MIN_MACOSX || true

      - name: Upload the helper
        uses: actions/upload-artifact@v4
        with:
          name: ls-helper
          path: AcademyLSDefault

  build:
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Unit tests (history, window-state, terminal, markdown routing + SDS-10 scans)
        run: node test/run-tests.cjs

      - name: Download the MD-T3 helper
        uses: actions/download-artifact@v4
        with:
          name: ls-helper

      - name: Fetch the pinned Electron distribution
        run: |
          curl -sL -o electron.zip https://github.com/electron/electron/releases/download/v22.3.27/electron-v22.3.27-darwin-x64.zip
          echo "01f053d08cb2855acb14f0465f4e36324a41bd13b3b2ead142970a56df3e9db1  electron.zip" | sha256sum -c -

      - name: Assemble + self-verify the package
        run: |
          python3 tools/assemble.py \
            --dist electron.zip --app app --assets assets \
            --ls-helper AcademyLSDefault \
            --out Muse-Academy-1013-x64.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create muse-academy-0.4.0-minion2 \
            Muse-Academy-1013-x64.zip \
            --title "Minion 0.4.0-minion2" \
            --notes "The data-separation build (Distro files/27), on the owner's directives of 2026-11-10 22:18 EST, completing the rename build 0.4.0-minion1 of the same evening (21:49-21:50 EST: 'rename academy muse to minion. set icon to your most nefarious avatar' + 'monochrome standard obviously'). (1) PREDECESSOR: Minion's previous version is Muse (Academy Build), bundle ai.muse.desktop — declared here and in the Distro catalog record, so an install of Minion supersedes that build. (2) APP DATA STORED SEPARATELY (owner coding standard): Minion keeps no user data inside the app bundle. Its data lives at ~/Library/Application Support/com.detroitautomationacademy.minion — a fresh location under the new bundle identity, created on first launch. The previous version's data remains untouched at ~/Library/Application Support/Muse, and removing either version's bundle never touches either data store. Nothing is migrated: expect a fresh sign-in and a fresh start in Minion. (minion1's notes said history and preferences carry via the shared folder; that was true of minion1's pin and is superseded by this standard.) (3) The rename stands from minion1: bundle Minion.app, executable Minion, Minion on every shipped surface, bundle identity com.detroitautomationacademy.minion, and the monochrome avatar icon (the scheming side-eye dog, SDS-3 tile, zero saturated pixels at every size). Everything from academy5 stands: the genuine Terminal view (View menu, Command-T) over the live hosted session, the terminal skin deleted outright, markdown routing + consented system default + Distro deep link, window repair, up-arrow history, SDS-8 welcome, SDS-10 conformance. Built from the open-source muse-desktop v0.3.0 (MIT) on the pinned Electron 22.3.27 distribution. Unsigned test build. Unofficial build: not a Meta product and not endorsed by Meta."
