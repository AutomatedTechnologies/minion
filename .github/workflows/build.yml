name: Build Minion

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  helper:
    runs-on: macos-15
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Compile AcademyLSDefault (MD-T3 helper, 10.13 floor, x86_64)
        run: |
          clang -arch x86_64 -mmacosx-version-min=10.13 \
            -framework CoreServices -framework Foundation \
            -o AcademyLSDefault tools/AcademyLSDefault.m
          file AcademyLSDefault
          otool -l AcademyLSDefault | grep -A1 LC_VERSION_MIN_MACOSX || true

      - name: Upload the helper
        uses: actions/upload-artifact@v4
        with:
          name: ls-helper
          path: AcademyLSDefault

  build:
    needs: helper
    runs-on: ubuntu-latest
    steps:
      - name: Check out build source
        uses: actions/checkout@v4

      - name: Unit tests (history, window-state, terminal, markdown routing + SDS-10 scans)
        run: node test/run-tests.cjs

      - name: Download the MD-T3 helper
        uses: actions/download-artifact@v4
        with:
          name: ls-helper

      - name: Fetch the pinned Electron distribution
        run: |
          curl -sL -o electron.zip https://github.com/electron/electron/releases/download/v22.3.27/electron-v22.3.27-darwin-x64.zip
          echo "01f053d08cb2855acb14f0465f4e36324a41bd13b3b2ead142970a56df3e9db1  electron.zip" | sha256sum -c -

      - name: Assemble + self-verify the package
        run: |
          python3 tools/assemble.py \
            --dist electron.zip --app app --assets assets \
            --ls-helper AcademyLSDefault \
            --out Minion-1013-x64.zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create minion-0.4.3 \
            Minion-1013-x64.zip \
            --title "Minion 0.4.3" \
            --notes "Minion 0.4.3 — the avatar-CPU fix (Distro files/39; estate review ER-15). The hosted page's looping avatar animation decoded and composited at full rate forever: the owner's Activity Monitor baseline on the MacBook Air (2026-11-12) charged the renderer + GPU pair 92.7% of one thread sustained against the Tachometer budget of 10%. 0.4.3 adds an avatar governor to the shell's preload: the page's animation is paused — CSS animations held, video elements paused — whenever the page is hidden, the window is not frontmost, or the app sits idle for 45 seconds (no owner input and no page content activity; a streaming reply counts as activity and resumes it instantly). Background throttling is now explicit on every window. The avatar's appearance while the app is in use is unchanged, and every 0.4.2 property stands: the sign-in repair (both plumbing identities at their pre-rename values, so an earlier build's sign-in carries in), bundle Minion.app under com.detroitautomationacademy.minion, monochrome avatar icon, title bar pinned to Minion, dark by default, the genuine Terminal view (View menu, Command-T), markdown routing to MacDown, up-arrow sent-message history stored only on this Mac, data stored separately at ~/Library/Application Support/com.detroitautomationacademy.minion, SDS-8 welcome, SDS-10 conformance. Note: sign-ins made inside 0.4.1's own separate session store are not read by this build. Built by the Detroit Automation Academy (application layer MIT) on the pinned Electron 22.3.27 distribution — the last Electron that runs on macOS 10.13. Unsigned test build. Unofficial build: not a Meta product and not endorsed by Meta."
